<div class="container py-5">
  <div class="card shadow-sm mx-auto" style="max-width: 430px">
    <div class="card-body p-4">
      <h1 class="h3 mb-4">Créer un compte</h1>
      @if (error()) {
        <div class="alert alert-danger">{{ error() }}</div>
      }
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label for="name" class="form-label">Nom</label>
          <input id="name" class="form-control" formControlName="name">
        </div>
        <div class="mb-3">
          <label for="register-email" class="form-label">Adresse email</label>
          <input id="register-email" type="email" class="form-control" formControlName="email">
        </div>
        <div class="mb-3">
          <label for="register-password" class="form-label">Mot de passe</label>
          <input id="register-password" type="password" class="form-control" formControlName="password">
          <div class="form-text">Au moins 8 caractères.</div>
        </div>
        <div class="mb-4">
          <label for="password-confirmation" class="form-label">Confirmer le mot de passe</label>
          <input id="password-confirmation" type="password" class="form-control" formControlName="password_confirmation">
        </div>
        <button class="btn btn-success w-100 mb-3" type="submit" [disabled]="loading()">
          {{ loading() ? 'Création...' : 'Créer mon compte' }}
        </button>
        <a routerLink="/login">J’ai déjà un compte</a>
      </form>
    </div>
  </div>
</div>
