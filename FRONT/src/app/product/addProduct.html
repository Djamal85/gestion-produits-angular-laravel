<div class="container py-5">
  <div class="card shadow-sm mx-auto" style="max-width: 650px">
    <div class="card-body p-4">
      <h1 class="h2 mb-4">
        {{ productId() ? 'Modifier le produit' : 'Ajouter un produit' }}
      </h1>
      @if (error()) {
        <div class="alert alert-danger">{{ error() }}</div>
      }
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label for="name" class="form-label">Nom</label>
          <input id="name" class="form-control" formControlName="name">
        </div>
        <div class="mb-3">
          <label for="category" class="form-label">Catégorie</label>
          <select id="category" class="form-select" formControlName="category_id">
            <option [ngValue]="0">Choisir une catégorie</option>
            @for (category of categories(); track category.id) {
              <option [ngValue]="category.id">{{ category.name }}</option>
            }
          </select>
          @if (categories().length === 0) {
            <div class="form-text text-warning">
              Créez d’abord une catégorie depuis le menu Catégories.
            </div>
          }
        </div>
        <div class="mb-3">
          <label for="price" class="form-label">Prix (F CFA)</label>
          <input id="price" type="number" min="0" class="form-control" formControlName="price">
        </div>
        <div class="mb-4">
          <label for="description" class="form-label">Description</label>
          <textarea id="description" rows="4" class="form-control" formControlName="description"></textarea>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-success" type="submit" [disabled]="loading()">
            {{ loading() ? 'Enregistrement...' : 'Enregistrer' }}
          </button>
          <a class="btn btn-outline-secondary" routerLink="/product">Annuler</a>
        </div>
      </form>
    </div>
  </div>
</div>
