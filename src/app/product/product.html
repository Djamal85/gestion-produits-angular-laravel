<div class="container mt-5">

  <a class="btn btn-success" routerLink="/addProduct">Add</a>
  <table class="table table-striped">
    <tr>
      <td>ID</td>
      <td>Name</td>
      <td>Prix</td>
      <td>Description</td>
    </tr>

    @for ( a of tabProduct(); track  a.id) {
      <tr>
        <td>{{a.id}}</td>
        <td>{{a.name}}</td>
        <td>{{a.prixe}}</td>
        <td>{{a.description}}</td>
        <td>
          <button (click)="delete(a.id)" class="btn btn-danger">Delete</button>
          <button class="btn btn-primary">Update</button>
        </td>
      </tr>
    }
  </table>



</div>
